# NOTE: this is the deployed Worker's identity (it sets the *.workers.dev URL and owns the secrets).
# Keep it as is even though the product is called Spectrix; renaming creates a brand-new Worker.
name = "threatlens"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

# The built React app. The Worker runs first ONLY for /api/*; everything else is served
# straight from the static assets (free, no Worker invocation) with SPA fallback to index.html.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Recommended: shared rate limiting + provider quota budgets across isolates. Run `npm run setup:kv` once
# (it creates the namespace and uncomments this block), then redeploy. Without it the API falls back to
# per-isolate memory counters, which are only best-effort.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<your-kv-namespace-id>"

# Workers AI: machine translation of non-English e-mails before the wording rules run (worker/_lib/translate.ts).
# Only the free daily allocation is used (no cap of the tool's own beyond Cloudflare's allowance; TRANSLATE_CONTENT = "false" switches it off).
[ai]
binding = "AI"

[vars]
RATE_LIMIT_PER_MIN = "60"
# IPQS calls go through the Vercel relay (relay/ipqs-vercel); the shared secret is the IPQS_RELAY_SECRET secret.
IPQS_RELAY_URL = "https://soc-osint-ipqs-vercel.vercel.app/api/ipqs"
# ALLOWED_ORIGINS = "https://example.com"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# Optional secrets (never commit). Each provider is skipped, and shown as such in the UI, when its key is absent:
#   npx wrangler secret put IPAPI_IS_API_KEY     # ipapi.is (primary IP provider works without it; a key raises the quota)
#   npx wrangler secret put PULSEDIVE_API_KEY    # Pulsedive: threat-intel risk, linked threats and feeds
#   npx wrangler secret put USERCHECK_API_KEY    # UserCheck.com: sender address / domain checks (disposable, spam, MX, domain age)
#   npx wrangler secret put ABUSEIPDB_API_KEY    # AbuseIPDB: abuse confidence
#   npx wrangler secret put APILAYER_API_KEY    # APILayer WHOIS: fallback for TLDs without RDAP (.de, .io, ...)
#   npx wrangler secret put CTLOGS_API_KEY       # ctlogs.dev: primary Certificate Transparency source
#   npx wrangler secret put VIRUSTOTAL_API_KEY   # VirusTotal: multi-engine verdicts (IPs, URLs, file hashes and file uploads)
#   npx wrangler secret put ABUSECH_AUTH_KEY     # abuse.ch Auth-Key (free): URLhaus (URL Intelligence) + MalwareBazaar (File Analysis)
#   npx wrangler secret put HYBRID_ANALYSIS_API_KEY  # Hybrid Analysis: sandbox verdict for a file SHA-256 (File Analysis)
#   npx wrangler secret put GOOGLE_SAFE_BROWSING_API_KEY  # Google Safe Browsing (URL Intelligence)
#   npx wrangler secret put URLSCAN_API_KEY      # urlscan.io (URL Intelligence); search works without it
#   npx wrangler secret put IPQS_RELAY_SECRET    # shared secret for the IPQS relay (same value as RELAY_SECRET in Vercel)
# Optional: OPENPHISH_FEED_URL overrides the OpenPhish feed (https only). The free community feed needs no key.
